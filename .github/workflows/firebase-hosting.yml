name: Deploy to Firebase Hosting

# PR을 열면 미리보기 주소가 생기고, main에 합치면 실제 주소로 배포된다.
# 필요한 설정 (GitHub 저장소 Settings > Secrets and variables > Actions):
#   Secrets   FIREBASE_SERVICE_ACCOUNT : Firebase 서비스 계정 키(JSON 전체)
#   Variables FIREBASE_PROJECT_ID      : Firebase 프로젝트 ID

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_deploy:
    # 포크에서 온 PR에는 시크릿이 전달되지 않으므로 배포하지 않는다
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
