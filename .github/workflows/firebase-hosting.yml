name: Deploy to Firebase Hosting

# PR을 열면 미리보기 주소가 생기고, main에 합치면 실제 주소로 배포된다.
# 필요한 설정 (GitHub 저장소 Settings > Secrets and variables > Actions):
#   Secrets   FIREBASE_SERVICE_ACCOUNT : Firebase 서비스 계정 키(JSON 전체)
#   Variables FIREBASE_PROJECT_ID      : Firebase 프로젝트 ID

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_deploy:
    # 포크에서 온 PR에는 시크릿이 전달되지 않으므로 배포하지 않는다
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
      # 서버 함수(포인트 정산)와 보안 규칙 배포: main 에 합쳐질 때만.
      # 서비스 계정에 권한이 부족해도 호스팅 배포는 이미 끝났으므로 실패해도 전체를 막지 않는다.
      - name: Deploy Cloud Functions
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          (cd functions && npm ci)
          npx --yes firebase-tools@latest deploy --only functions --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
      - name: Deploy Firestore rules
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only firestore:rules --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
